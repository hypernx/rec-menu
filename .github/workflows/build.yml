name: build-ovl

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v6
        with:
          path: src

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git make
          dkp-pacman -S --needed --noconfirm switch-dev || true

      - name: Get Tesla-Template
        run: git clone --recursive https://github.com/WerWolv/Tesla-Template.git tpl

      - name: Patch libtesla (keep overlay out of game video)
        run: |
          # Teslaの画面がゲームの録画映像に写り込まないようにする
          T=tpl/libs/libtesla/include/tesla.hpp
          sed -i '/viAddToLayerStack(&this->m_layer, ViLayerStack_Recording));/d' $T
          # HOMEボタンと終了処理のフックを追加する
          sed -i '/^#define ELEMENT_BOUNDS/a namespace tsl::impl { inline void (*onHomeButton)() = nullptr; inline void (*onBeforeExitScreen)() = nullptr; }' $T
          sed -i '/case WaiterObject_HomeButton:/a\                            if (tsl::impl::onHomeButton) tsl::impl::onHomeButton();' $T
          sed -i 's/^\( *\)overlay->exitScreen();/\1if (tsl::impl::onBeforeExitScreen) tsl::impl::onBeforeExitScreen();\n\1overlay->exitScreen();/' $T
          grep -n 'onHomeButton\|onBeforeExitScreen\|ViLayerStack_Recording' $T
          grep -q 'tsl::impl::onHomeButton();' $T && grep -q 'tsl::impl::onBeforeExitScreen();' $T

      - name: Replace sources
        run: |
          rm -rf tpl/source/*
          cp src/source/*.cpp src/source/*.hpp tpl/source/

      - name: Build (English / Japanese)
        run: |
          cd tpl
          VER=$(grep -oE '"v[0-9.]+"' ../src/source/main.cpp | head -1 | tr -d '"v')
          echo "version: $VER"
          mkdir -p ../out
          # 英語版 → 日本語版の順にビルドする(-DLANG_JA で日本語)
          for L in en ja; do
            make clean >/dev/null
            if [ "$L" = ja ]; then DEF=-DLANG_JA; else DEF=; fi
            # Ultrahandの一覧に「Rec Menu」とバージョンが出るようにする
            make DEFINES="$DEF" APP_TITLE="Rec Menu" APP_AUTHOR="hypernx" APP_VERSION="$VER"
            cp tpl.ovl ../out/RecMenu-$L.ovl
            cp tpl.elf ../out/RecMenu-$L.elf
          done
          ls -l ../out

      - name: Upload ovl
        uses: actions/upload-artifact@v6
        with:
          name: ovl
          path: out/*

  gallery:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v6

      - name: Install libraries
        run: dkp-pacman -S --needed --noconfirm switch-ffmpeg switch-sdl2 switch-sdl2_ttf switch-sdl2_image || true

      - name: Build Rec Gallery (English / Japanese)
        run: |
          mkdir -p out
          for L in en ja; do
            make -C gallery clean >/dev/null
            if [ "$L" = ja ]; then DEF=-DLANG_JA; else DEF=; fi
            make -C gallery -j4 DEFINES="$DEF"
            cp gallery/RecGallery.nro out/RecGallery-$L.nro
            cp gallery/RecGallery.elf out/RecGallery-$L.elf
          done
          ls -l out

      - name: Upload nro
        uses: actions/upload-artifact@v6
        with:
          name: nro
          path: out/*

  # リリースページを作ってファイルを載せる
  #  - main に push したとき: source/main.cpp のバージョン(例: v0.7.0)のリリースを作る
  #    (もうあれば、文章とファイルを差し替える)
  #  - v から始まるタグを push したとき: そのタグでリリースを作る
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [build, gallery]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (release notes)
        uses: actions/checkout@v6

      - name: Download builds
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Make SD card packages
        run: |
          cd dist
          for L in en ja; do
            rm -rf sd && mkdir -p sd/switch/.overlays
            cp RecMenu-$L.ovl sd/switch/.overlays/RecMenu.ovl
            cp RecGallery-$L.nro sd/switch/RecGallery.nro
            (cd sd && zip -qr ../Rec-Menu-and-Gallery-$L.zip switch)
          done
          zip -q symbols-debug.zip *.elf
          rm -rf sd
          ls -l

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG=$(grep -oE '"v[0-9.]+"' source/main.cpp | head -1 | tr -d '"')
          fi
          echo "tag: $TAG"
          FILES="dist/Rec-Menu-and-Gallery-en.zip dist/Rec-Menu-and-Gallery-ja.zip dist/RecMenu-en.ovl dist/RecMenu-ja.ovl dist/RecGallery-en.nro dist/RecGallery-ja.nro dist/symbols-debug.zip"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 同じバージョンのリリースがあれば、文章とファイルを最新に差し替える
            echo "Release $TAG already exists. Updating notes and files."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file .github/release-notes.md
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $FILES
            # 名前が変わるなどして、今回のファイルに無い古いファイルは消す
            for A in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
              case " $FILES " in
                *"/$A "*) ;;
                *) echo "delete old asset: $A"; gh release delete-asset "$TAG" "$A" --repo "$GITHUB_REPOSITORY" -y ;;
              esac
            done
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Rec Menu & Rec Gallery $TAG" \
            --notes-file .github/release-notes.md \
            $FILES
