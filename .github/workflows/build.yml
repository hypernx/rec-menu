name: build-ovl

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git make
          dkp-pacman -S --needed --noconfirm switch-dev || true

      - name: Get Tesla-Template
        run: git clone --recursive https://github.com/WerWolv/Tesla-Template.git tpl

      - name: Patch libtesla (keep overlay out of game video)
        run: |
          # Teslaの画面がゲームの録画映像に写り込まないようにする
          sed -i '/viAddToLayerStack(&this->m_layer, ViLayerStack_Recording));/d' tpl/libs/libtesla/include/tesla.hpp
          grep -c 'ViLayerStack_Recording' tpl/libs/libtesla/include/tesla.hpp || true

      - name: Replace sources
        run: |
          rm -rf tpl/source/*
          cp src/source/*.cpp src/source/*.hpp tpl/source/

      - name: Build
        run: |
          cd tpl
          VER=$(grep -oE '"v[0-9.]+"' ../src/source/main.cpp | head -1 | tr -d '"v')
          echo "version: $VER"
          # Ultrahandの一覧に「Rec Menu」とバージョンが出るようにする
          make APP_TITLE="Rec Menu" APP_AUTHOR="hypernx" APP_VERSION="$VER"

      - name: Upload ovl
        uses: actions/upload-artifact@v4
        with:
          name: ovl
          path: |
            tpl/*.ovl
            tpl/*.elf

  gallery:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4

      - name: Install libraries
        run: dkp-pacman -S --needed --noconfirm switch-ffmpeg switch-sdl2 switch-sdl2_ttf switch-sdl2_image || true

      - name: Build Rec Gallery (NRO)
        run: make -C gallery -j4

      - name: Upload nro
        uses: actions/upload-artifact@v4
        with:
          name: nro
          path: |
            gallery/RecGallery.nro
            gallery/RecGallery.elf
