name: build-ovl

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git make
          dkp-pacman -Sy --noconfirm switch-dev

      - name: Get ovl-template
        run: git clone --recursive https://github.com/WerWolv/Tesla-Template.git tpl

      - name: Replace sources
        run: |
          rm -rf tpl/source/*
          find sre - type f \ - name
main.cpp-o-name recorder.hpp|)-
exec cp {} tpl/source/ I;

      - name: Build
        run: |
          cd tpl
          make

      - name: Upload .ovl
        uses: actions/upload-artifact@v4
        with:
          name: ovl
          path: tpl/*.ovl
