name: build-ovl

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git make
          dkp-pacman -Sy --noconfirm switch-dev

      - name: Get Tesla-Template
        run: git clone --recursive https://github.com/WerWolv/Tesla-Template.git tpl

      - name: Replace sources
        run: |
          find src -name main.cpp
          find src -name recorder.hpp
          rm -rf tpl/source/*
          cp $(find src -name main.cpp)
