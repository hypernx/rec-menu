name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - run: |
          dkp-pacman -S --needed --noconfirm switch-ffmpeg >/dev/null 2>&1; echo install=$?
          NM=$DEVKITPRO/devkitA64/bin/aarch64-none-elf-nm
          L=$DEVKITPRO/portlibs/switch/lib
          for s in ff_aac_encoder ff_mp4_muxer ff_mov_muxer ff_aac_decoder ff_pcm_s16le_decoder ff_libfdk_aac_encoder; do echo "$s: $($NM $L/libavcodec.a $L/libavformat.a 2>/dev/null | grep -cE " [DR] $s$")"; done
          strings $L/libavutil.a | grep -m1 -- "--enable" | tr ' ' '\n' | grep -E "encoder|muxer|disable-everything|enable-gpl|aac" | head -30
